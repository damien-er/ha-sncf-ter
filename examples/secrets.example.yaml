# À ajouter dans /config/secrets.yaml (jamais dans le dépôt).
#
# L'API SNCF (Navitia) utilise une authentification HTTP Basic : le jeton est
# le NOM D'UTILISATEUR, le mot de passe est vide.
# Contournement retenu (voir CHANGELOG 2.0.0) : on pré-encode l'en-tête complet.
#
#   echo -n "VOTRE_JETON:" | base64
#
# puis on stocke "Basic " + le résultat :
sncf_api_token_b64: "Basic dm90cmVfamV0b246"   # exemple factice = "votre_jeton:"
